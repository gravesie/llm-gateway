name: CI

# Lint and the full suite on every pull request and on main.
#
# This project is a library, not a deployed service, so there is no deploy job.
# Releases are cut by pushing a tag; see DEPLOY.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest

  # The two standing process checks, kept as their own job rather than as steps in
  # `test`: they need no dependency install, and keeping them separate means a red
  # process check is distinguishable at a glance from a failing lint/test run. A
  # standalone checks.yml would be the other option, and is what repos with no CI at
  # all got; this repo already has a workflow, so a second file would just be noise.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Before the budget, because it validates the budget check's own input:
      # line-ending drift makes the local and CI measurements of the same file disagree.
      - name: Environment check
        run: python scripts/check_environment.py

      - name: Context budget
        run: python scripts/check_context_budget.py

  release:
    name: Build and publish release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build distribution
        run: python -m pip install --upgrade pip build && python -m build
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
